name: Pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Format, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore grimoire.slnx

      - name: Check formatting
        run: |
          dotnet format grimoire/grimoire.csproj --verify-no-changes --no-restore
          dotnet format tests/grimoire.Tests/grimoire.Tests.csproj --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build grimoire.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test grimoire.slnx --configuration Release --no-build
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
